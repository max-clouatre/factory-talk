name: validate
# Runs the validation station on every push and pull request.
# A red check here means a standing rule in AGENTS.md is broken.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 checks/validate.py
